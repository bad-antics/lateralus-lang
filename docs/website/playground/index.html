hello: `// Welcome to Lateralus!
// A pipeline-native programming language.

    let name = "World"

pipeline: `// Pipeline Operator \u2014 Lateralus's signature feature
// Chain functions left-to-right with |>

import std::io
import std::collections

struct Transaction {
    category: String,
    amount: Float,
    description: String,
}

fn main() {
    let transactions = [
        Transaction { category: "food",   amount: 42.50, description: "Groceries" },
        Transaction { category: "tech",   amount: 199.99, description: "Keyboard" },
        Transaction { category: "food",   amount: 18.75, description: "Lunch" },
        Transaction { category: "tech",   amount: 29.99, description: "USB Hub" },
        Transaction { category: "books",  amount: 14.99, description: "Rust Book" },
        Transaction { category: "food",   amount: 55.00, description: "Dinner" },
        Transaction { category: "tech",   amount: 549.00, description: "Monitor" },
    ]

    let report = transactions
        |> filter(|t| t.amount > 20.0)
        |> group_by(|t| t.category)
        |> map_entries(|cat, txns| {
            let total = txns |> map(|t| t.amount) |> sum()
            let count = txns |> len()
            (cat, total, count)
        })
        |> sort_by(|entry| entry.1, descending)

    println("=== Spending Report (> $20) ===")
    for (category, total, count) in report {
        println("  {category}: \${total:.2} ({count} transactions)")
    }

    let avg = transactions
        |> map(|t| t.amount)
        |> average()

    println("\\nAverage transaction: \${avg:.2}")
}`,

pattern: `// Pattern Matching \u2014 exhaustive and expressive

import std::io
import std::math

enum Shape {
    Circle(Float),
    Rect(Float, Float),
    Triangle(Float, Float),
    Polygon(Vec<(Float, Float)>),
}

fn area(shape: Shape) -> Float {
    match shape {
        Circle(r)       => math::pi * r * r,
        Rect(w, h)      => w * h,
        Triangle(b, h)  => 0.5 * b * h,
        Polygon(points) => polygon_area(points),
    }
}

fn describe(shape: Shape) -> String {
    match shape {
        Circle(r) if r > 100.0  => "Large circle (r={r})",
        Circle(r)               => "Circle (r={r})",
        Rect(w, h) if w == h    => "Square ({w}x{h})",
        Rect(w, h)              => "Rectangle ({w}x{h})",
        Triangle(b, h)          => "Triangle (base={b}, h={h})",
        Polygon(pts)            => "Polygon ({pts |> len()} sides)",
    }
}

fn polygon_area(points: Vec<(Float, Float)>) -> Float {
    let n = points |> len()
    (0..n)
        |> map(|i| {
            let (x1, y1) = points[i]
            let (x2, y2) = points[(i + 1) % n]
            x1 * y2 - x2 * y1
        })
        |> sum()
        |> abs()
        |> div(2.0)
}

fn main() {
    let shapes = [
        Circle(5.0),
        Rect(10.0, 10.0),
        Rect(3.0, 7.0),
        Triangle(8.0, 4.0),
        Circle(150.0),
    ]

    for shape in shapes {
        let desc = describe(shape)
        let a = area(shape)
        println("{desc} => area = {a:.2}")
    }
}`,

async: `// Async / Concurrency \u2014 lightweight tasks with spawn

import std::io
import std::net::http
import std::time

async fn fetch_data(url: String) -> Result<String, Error> {
    println("  Fetching {url}...")
    let resp = http::get(url) |> await?
    println("  Got {resp.status} from {url} ({resp.body |> len()} bytes)")
    Ok(resp.body)
}

async fn process_batch(urls: [String]) -> [Result<String, Error>] {
    let tasks = urls
        |> map(|url| spawn { fetch_data(url) |> await })

    let results = tasks |> await_all()

    let successes = results |> filter(|r| r.is_ok()) |> len()
    println("\\nCompleted: {successes}/{results |> len()} succeeded")

    results
}

fn main() {
    let urls = [
        "https://api.github.com/repos/bad-antics/lateralus-lang",
        "https://httpbin.org/get",
        "https://httpbin.org/delay/1",
        "https://jsonplaceholder.typicode.com/posts/1",
    ]

    println("=== Concurrent HTTP Fetcher ===\\n")

    let start = time::now()
    let results = process_batch(urls) |> await
    let elapsed = time::since(start)

    println("\\nTotal time: {elapsed.as_millis()}ms")
    println("(Sequential would be ~4x slower)")
}`,

struct: `// Structs, Impl Blocks & Traits

import std::io

struct Vec2 {
    x: Float,
    y: Float,
}

impl Vec2 {
    fn new(x: Float, y: Float) -> Vec2 {
        Vec2 { x, y }
    }

    fn magnitude(self) -> Float {
        (self.x * self.x + self.y * self.y) |> sqrt()
    }

    fn normalize(self) -> Vec2 {
        let mag = self.magnitude()
        Vec2 { x: self.x / mag, y: self.y / mag }
    }

    fn dot(self, other: Vec2) -> Float {
        self.x * other.x + self.y * other.y
    }

    fn add(self, other: Vec2) -> Vec2 {
        Vec2 { x: self.x + other.x, y: self.y + other.y }
    }

    fn scale(self, factor: Float) -> Vec2 {
        Vec2 { x: self.x * factor, y: self.y * factor }
    }

    fn to_string(self) -> String {
        "({self.x:.2}, {self.y:.2})"
    }
}

fn main() {
    let a = Vec2::new(3.0, 4.0)
    let b = Vec2::new(1.0, 2.0)

    println("a = {a.to_string()}")
    println("b = {b.to_string()}")
    println("|a| = {a.magnitude():.2}")
    println("a normalized = {a.normalize().to_string()}")
    println("a \u00b7 b = {a.dot(b):.2}")

    let sum = a.add(b)
    println("a + b = {sum.to_string()}")

    // Pipeline with methods
    let result = Vec2::new(10.0, 0.0)
        |> scale(0.5)
        |> add(Vec2::new(0.0, 3.0))
        |> normalize()

    println("\\nPipelined result: {result.to_string()}")
}`,

import std::io
import std::collections

fn main() {
    let words = [
        "spiral", "beyond", "reaching", "over",
        "the", "lateralus", "pattern", "a",
        "fibonacci", "in", "sequence", "hidden",
    ]

    let result = words
        |> filter(|w| w |> len() > 2)
        |> map(|w| w |> capitalize())
        |> enumerate()
        |> map(|(i, w)| "{i + 1}. {w}")
        |> join("\\n")

    println("=== Words (3+ letters, capitalized) ===")
    println(result)

    let fibs = (0..15)
        |> map(fib)
        |> collect()

    println("\\n=== Fibonacci ===")
    println(fibs |> map(to_string) |> join(", "))

fn fib(n: Int) -> Int {

        1 => 1,

fn find_pairs(nums: [Int], target: Int) -> [(Int, Int)] {
    nums
        |> enumerate()
        |> flat_map(|(i, a)| {

                |> filter(|b| a + b == target)
                |> map(|b| (a, b))
        })
        |> collect()

error: `// Error Handling \u2014 try / recover / ensure

import std::io
import std::fs

enum AppError {
    NotFound(String),
    ParseError(String, Int),
    Overflow(String),
}

fn parse_config(path: String) -> Result<Config, AppError> {
    let content = fs::read_to_string(path)
        |> map_err(|_| AppError::NotFound("Config not found: {path}"))?

    let lines = content |> split("\\n") |> enumerate()

    let mut config = Config::default()

    for (line_num, line) in lines {
        let line = line |> trim()
        if line |> is_empty() || line |> starts_with("#") {
            continue
        }

        let parts = line |> split("=") |> map(trim) |> collect()
        if parts |> len() != 2 {
            return Err(AppError::ParseError(line, line_num + 1))
        }

        match parts[0] {
            "port"     => config.port = parts[1] |> parse_int()?,
            "host"     => config.host = parts[1],
            "workers"  => config.workers = parts[1] |> parse_int()?,
            unknown    => println("  warn: unknown key '{unknown}'"),
        }
    }

    Ok(config)
}

struct Config {
    host: String,
    port: Int,
    workers: Int,
}

impl Config {
    fn default() -> Config {
        Config { host: "localhost", port: 8080, workers: 4 }
    }
}

fn main() {
    println("=== Config Loader ===\\n")

    try {
        let config = parse_config("server.conf")?
        println("Loaded: {config.host}:{config.port}")
        println("Workers: {config.workers}")
    } recover err {
        match err {
            AppError::NotFound(msg)      => println("Error: {msg}"),
            AppError::ParseError(ln, n)  => println("Parse error at line {n}: {ln}"),
            AppError::Overflow(msg)      => println("Overflow: {msg}"),
        }
    } ensure {
        println("\\nConfig loading complete.")
    }
}`,

webserver: `// Web Server \u2014 HTTP routing with pipelines

import std::io
import std::net::http
import std::json

struct User {
    id: Int,
    name: String,
    email: String,
}

// In-memory store
let mut users: Vec<User> = []
let mut next_id: Int = 1

fn home_handler(req: Request) -> Response {
    Response::html("<h1>Lateralus API Server</h1>
        <p>Try: GET /api/users, POST /api/users</p>")
}

fn list_users(req: Request) -> Response {
    users
        |> map(|u| json::object({
            "id": u.id,
            "name": u.name,
            "email": u.email,
        }))
        |> json::array()
        |> Response::json()
}

fn create_user(req: Request) -> Response {
    let body = req.body |> json::parse()

    let user = User {
        id: next_id,
        name: body["name"] |> to_string(),
        email: body["email"] |> to_string(),
    }
    next_id += 1
    users |> push(user)

    println("Created user: {user.name} ({user.email})")

    Response::json(json::object({ "ok": true, "id": user.id }))
        |> with_status(201)
}

fn not_found(req: Request) -> Response {
    Response::json(json::object({ "error": "not found" }))
        |> with_status(404)
}

fn main() {
    let app = Router::new()
        |> get("/",           home_handler)
        |> get("/api/users",  list_users)
        |> post("/api/users", create_user)
        |> fallback(not_found)

    println("Server listening on http://0.0.0.0:8080")
    http::serve("0.0.0.0:8080", app) |> await
}`,

generics: `// Generics \u2014 type-safe polymorphism with constraints

import std::io
import std::collections

fn max_of<T: Ord>(items: Vec<T>) -> Option<T> {
    items
        |> reduce(|a, b| if a > b { a } else { b })
}

struct Stack<T> {
    items: Vec<T>,
}

impl<T> Stack<T> {
    fn new() -> Stack<T> {
        Stack { items: [] }
    }

    fn push(self, item: T) -> Stack<T> {
        self.items |> append(item)
        self
    }

    fn pop(self) -> (Option<T>, Stack<T>) {
        match self.items |> last() {
            Some(item) => {
                self.items |> drop_last()
                (Some(item), self)
            },
            None => (None, self),
        }
    }

    fn peek(self) -> Option<T> {
        self.items |> last()
    }

    fn size(self) -> Int {
        self.items |> len()
    }
}

struct Pair<A, B> {
    first: A,
    second: B,
}

impl<A, B> Pair<A, B> {
    fn map_first<C>(self, f: fn(A) -> C) -> Pair<C, B> {
        Pair { first: f(self.first), second: self.second }
    }
}

fn main() {
    let nums = [42, 17, 99, 3, 55]
    println("Max of {nums}: {max_of(nums)}")

    let words = ["apple", "mango", "banana"]
    println("Max of words: {max_of(words)}")

    let stack = Stack::new()
        |> push(10)
        |> push(20)
        |> push(30)

    println("Stack size: {stack.size()}")
    println("Top: {stack.peek()}")

    let (val, stack) = stack.pop()
    println("Popped: {val}")
    println("New top: {stack.peek()}")

    let pair = Pair { first: 42, second: "hello" }
    let doubled = pair.map_first(|n| n * 2)
    println("Pair: ({doubled.first}, {doubled.second})")
}`,

import std::io

fn compose<A, B, C>(f: fn(A) -> B, g: fn(B) -> C) -> fn(A) -> C {
    |x| g(f(x))
}

fn apply_n<T>(f: fn(T) -> T, n: Int, value: T) -> T {
    (0..n) |> fold(value, |acc, _| f(acc))
}

    let add_one = |x| x + 1

import std::io
import std::collections::HashMap
import math::{sqrt, pow, pi}
import utils::validation

module geometry {
    pub struct Point {
        x: Float,
        y: Float,
    }

    pub fn distance(a: Point, b: Point) -> Float {
        let dx = b.x - a.x
        let dy = b.y - a.y
        sqrt(dx * dx + dy * dy)
    }

    pub fn midpoint(a: Point, b: Point) -> Point {
        Point {
            x: (a.x + b.x) / 2.0,
            y: (a.y + b.y) / 2.0,
        }
    }

    fn normalize(p: Point) -> Point {
        let mag = sqrt(p.x * p.x + p.y * p.y)
        Point { x: p.x / mag, y: p.y / mag }
    }

    pub fn unit_vector(from: Point, to: Point) -> Point {
        let dx = to.x - from.x
        let dy = to.y - from.y
        normalize(Point { x: dx, y: dy })
    }
}

module colors {
    pub enum Color {
        Red, Green, Blue,
        RGB(Int, Int, Int),
        Hex(String),
    }

    pub fn to_hex(c: Color) -> String {
        match c {
            Red          => "#FF0000",
            Green        => "#00FF00",
            Blue         => "#0000FF",
            RGB(r, g, b) => format("#{r:02x}{g:02x}{b:02x}"),
            Hex(s)       => s,
        }
    }
}

    let a = geometry::Point { x: 0.0, y: 0.0 }
    let b = geometry::Point { x: 3.0, y: 4.0 }

import std::io

fn fibonacci() -> Iterator<Int> {
    let a = 0
    let b = 1
    iter::generate(|| {
        let current = a
        let next = a + b
        a = b
        b = next
        current
    })

        |> match {

                output: matches |> get_option("output"),
                format: matches |> get_option("format"),
            },
            Err(e) => {
                println("Error: {e}")
                app |> App::print_help()
                exit(1)
            },
        }
}

fn analyze_file(path: String, verbose: Bool) -> Analysis {
    let source = fs::read_to_string(path)

                |> count_line(line)
                |> detect_function(line)

gameloop: `// Game Loop \u2014 entity-component system with pipelines

import std::io
import std::math

struct Vec2 {
    x: Float,
    y: Float,
}

impl Vec2 {
    fn add(self, other: Vec2) -> Vec2 {
        Vec2 { x: self.x + other.x, y: self.y + other.y }
    }
    fn scale(self, s: Float) -> Vec2 {
        Vec2 { x: self.x * s, y: self.y * s }
    }
    fn magnitude(self) -> Float {
        math::sqrt(self.x * self.x + self.y * self.y)
    }
}

enum EntityKind {
    Player,
    Enemy(String),
    Projectile,
}

struct Entity {
    kind: EntityKind,
    pos: Vec2,
    vel: Vec2,
    hp: Int,
    active: Bool,
}

fn update_physics(entities: Vec<Entity>, dt: Float) -> Vec<Entity> {
    entities
        |> filter(|e| e.active)
        |> map(|e| Entity {
            pos: e.pos.add(e.vel.scale(dt)),
            ..e
        })
}

fn check_collisions(entities: Vec<Entity>) -> Vec<Entity> {
    entities |> map(|e| {
        match e.kind {
            Projectile => {
                let hit = entities
                    |> filter(|other| match other.kind {
                        Enemy(_) => true, _ => false
                    })
                    |> find(|enemy| distance(e.pos, enemy.pos) < 1.5)

                match hit {
                    Some(enemy) => Entity { active: false, ..e },
                    None => e,
                }
            },
            _ => e,
        }
    })
}

fn render(entities: Vec<Entity>) {
    entities
        |> filter(|e| e.active)
        |> sort_by(|e| e.pos.y)
        |> each(|e| {
            let label = match e.kind {
                Player       => "\u{1F3AE} Player",
                Enemy(name)  => "\u{1F47E} {name}",
                Projectile   => "\u{1F4AB} Bullet",
            }
            println("  {label} at ({e.pos.x:.1}, {e.pos.y:.1}) HP:{e.hp}")
        })
}

fn main() {
    let entities = [
        Entity { kind: Player, pos: Vec2{x:0.0,y:0.0}, vel: Vec2{x:1.0,y:0.5}, hp: 100, active: true },
        Entity { kind: Enemy("Drone"), pos: Vec2{x:10.0,y:5.0}, vel: Vec2{x:-0.5,y:0.0}, hp: 30, active: true },
        Entity { kind: Enemy("Boss"), pos: Vec2{x:20.0,y:8.0}, vel: Vec2{x:0.0,y:-0.2}, hp: 200, active: true },
        Entity { kind: Projectile, pos: Vec2{x:1.0,y:0.5}, vel: Vec2{x:5.0,y:2.0}, hp: 1, active: true },
    ]

    println("=== Game State ===")
    let state = entities
    for frame in 0..3 {
        println("\\n--- Frame {frame} ---")
        state = state
            |> update_physics(0.16)
            |> check_collisions()
        render(state)
    }

    let alive = state |> filter(|e| e.active) |> len()
    println("\\nActive entities: {alive}/{entities |> len()}")
}`,

// New in Lateralus v0.5.0

import std::io
import std::sync::{channel, select}
import std::time

struct SensorReading {
    sensor_id: String,
    value: Float,
    timestamp: Int,
}

async fn temperature_sensor(tx: Sender<SensorReading>) {
    for i in 0..5 {
        time::sleep(100) |> await
        let reading = SensorReading {
            sensor_id: "temp-01",
            value: 20.0 + (i as Float * 0.5),
            timestamp: time::now_ms(),
        }
        tx |> send(reading) |> await
    }
    tx |> close()
}

async fn pressure_sensor(tx: Sender<SensorReading>) {
    for i in 0..3 {
        time::sleep(150) |> await
        let reading = SensorReading {
            sensor_id: "pres-01",
            value: 1013.25 + (i as Float * 2.0),
            timestamp: time::now_ms(),
        }
        tx |> send(reading) |> await
    }
    tx |> close()
}

async fn monitor(temp_rx: Receiver<SensorReading>, pres_rx: Receiver<SensorReading>) {
    let mut count = 0
    loop {
        select {
            reading from temp_rx => {
                println("  [TEMP] {reading.sensor_id}: {reading.value:.1}\u00b0C")
                count += 1
            },
            reading from pres_rx => {
                println("  [PRES] {reading.sensor_id}: {reading.value:.2} hPa")
                count += 1
            },
            closed => {
                println("\\nAll sensors closed. Total readings: {count}")
                break
            },
        }
    }
}

fn main() {
    let (temp_tx, temp_rx) = channel::<SensorReading>(8)
    let (pres_tx, pres_rx) = channel::<SensorReading>(8)

    println("=== Sensor Monitor (Channels + Select) ===\\n")

    spawn { temperature_sensor(temp_tx) |> await }
    spawn { pressure_sensor(pres_tx) |> await }
    monitor(temp_rx, pres_rx) |> await
}`,

// New in Lateralus v0.5.0

import std::io
import std::collections::HashMap

// Declarative macro for quick struct builders
macro define_builder($name:ident, $($field:ident : $type:ty),*) {
    struct $name {
        $($field: Option<$type>,)*
    }

    impl $name {
        fn new() -> $name {
            $name { $($field: None,)* }
        }

        $(fn $field(self, val: $type) -> $name {
            $name { $field: Some(val), ..self }
        })*

        fn build(self) -> Result<$name, String> {
            $(if self.$field.is_none() {
                return Err("Missing field: " + stringify!($field))
            })*
            Ok(self)
        }
    }
}

// Use the macro
define_builder!(UserBuilder, name: String, age: Int, email: String)

// Procedural macro for auto-serialization
macro derive_json($struct_name:ident) {
    impl $struct_name {
        fn to_json(self) -> String {
            let fields = struct_fields!(self)
                |> map(|(name, val)| "\\\"{name}\\\": {json_value(val)}")
                |> join(", ")
            "{ " + fields + " }"
        }
    }
}

// Macro for pipeline operators
macro pipe_debug($expr:expr) {
    {
        let __val = $expr
        println("  [debug] {stringify!($expr)} = {__val}")
        __val
    }
}

    // Builder pattern via macro

        |> name("Alice")
        |> age(30)
        |> email("wizard@lateralus.dev")

effects: `// Effect System — algebraic effects and handlers
// New in Lateralus v0.5.0

import std::io
import std::collections

// Define effects as first-class constructs
effect Log {
    fn log(level: String, message: String) -> ()
}

effect State<T> {
    fn get() -> T
    fn put(value: T) -> ()
}

effect Fail {
    fn fail(reason: String) -> Never
}

// A function that uses effects (declared in signature)
fn process_items(items: [String]) -> [String] with Log, State<Int>, Fail {
    let mut results = []

    for item in items {
        let count = perform State::get()

        if item |> is_empty() {
            perform Log::log("warn", "Empty item at index {count}")
            perform Fail::fail("Empty item encountered")
        }

        let processed = item
            |> trim()
            |> to_uppercase()

        perform Log::log("info", "Processed: {processed}")
        perform State::put(count + 1)
        results |> push(processed)
    }

    results
}

fn main() {
    println("=== Effect System ===\\n")

    let items = ["hello", "  world  ", "lateralus", "", "effects"]

    // Handle effects at the call site
    let result = handle {
        process_items(items)
    } with {
        Log::log(level, msg) => {
            let prefix = match level {
                "info" => "\u2705",
                "warn" => "\u26a0\ufe0f",
                "error" => "\u274c",
                _ => "\u2022",
            }
            println("  {prefix} [{level}] {msg}")
            resume(())
        },
        State::get() => resume(0) with State<Int>,
        State::put(n) => resume(()) with State<Int>,
        Fail::fail(reason) => {
            println("  \u274c [fail] {reason} — skipping")
            resume(())
        },
    }

    println("\\nResult: {result}")
    println("Processed {result |> len()} items")
}`,

struct Config {
    @range(1, 65535)
    port: Int,

    @not_empty
    host: String,

    @min(1) @max(256)
    workers: Int,
}

// Route decorators for web
@controller("/api/users")
struct UserController {}

impl UserController {
    @get("/")
    @cache(ttl: 60)
    fn list(self, req: Request) -> Response {
        Response::json(get_all_users())
    }

    @post("/")
    @auth("admin")
    fn create(self, req: Request) -> Response {

        Response::json(create_user(user)) |> with_status(201)
    }
}

comptime: `// Compile-Time Evaluation — const fn and comptime blocks
// New in Lateralus v0.5.0

import std::io

// Compile-time function evaluation
const fn factorial(n: Int) -> Int {
    match n {
        0 | 1 => 1,
        n     => n * factorial(n - 1),
    }
}

// Computed at compile time, zero runtime cost
const FACT_10: Int = factorial(10)
const FACT_20: Int = factorial(20)

// Compile-time type-level programming
const fn type_name<T>() -> String {
    comptime {
        match T {
            Int    => "integer",
            Float  => "float",
            String => "string",
            Bool   => "boolean",
            Vec<_> => "vector",
            _      => "unknown",
        }
    }
}

// Compile-time lookup tables
const LUT: [Int; 256] = comptime {
    let mut table = [0; 256]
    for i in 0..256 {
        table[i] = (i * 17 + 31) % 256
    }
    table
}

// Static assertions
static_assert!(FACT_10 == 3628800, "factorial(10) should be 3628800")
static_assert!(LUT[0] == 31, "LUT[0] should be 31")

// Conditional compilation
const fn platform_config() -> Config {
    comptime {
        match target::os() {
            "linux"   => Config { threads: 8, allocator: "jemalloc" },
            "macos"   => Config { threads: 8, allocator: "mimalloc" },
            "windows" => Config { threads: 4, allocator: "system" },
            _         => Config { threads: 2, allocator: "system" },
        }
    }
}

// Compile-time string processing
const GREETING: String = comptime {
    let parts = ["Lateralus", "v0.5.0", "Comptime"]
    parts |> join(" | ")
}

fn main() {
    println("=== Compile-Time Evaluation ===\\n")

    println("factorial(10) = {FACT_10}")
    println("factorial(20) = {FACT_20}")

    println("\\nType names (resolved at compile time):")
    println("  Int    -> {type_name::<Int>()}")
    println("  Float  -> {type_name::<Float>()}")
    println("  String -> {type_name::<String>()}")
    println("  Vec<_> -> {type_name::<Vec<Int>>()}")

    println("\\nLUT samples:")
    println("  LUT[0]   = {LUT[0]}")
    println("  LUT[42]  = {LUT[42]}")
    println("  LUT[255] = {LUT[255]}")

    println("\\nPlatform: {platform_config()}")
    println("Greeting: {GREETING}")
    println("\\nAll static assertions passed at compile time.")
}`,

    spiral_auth_server: "// ===================================================================\n// examples/spiral_auth_server.ltl\n// -------------------------------------------------------------------\n// Spiral Wave 1 integrative demo \u2014 ties together the new stdlib\n// modules (argon2 + jwt + totp + metrics + tracing) into a tiny\n// auth service skeleton.  Wires every request through a span, meters\n// it in a registry, and hashes/verifies passwords with argon2id.\n// ===================================================================\n\nimport argon2\nimport jwt\nimport totp\nimport metrics\nimport tracing\nimport time\n\n// -- Bootstrap ------------------------------------------------------\n\npub fn build_registry() -> map {\n    let reg = metrics_new_registry()\n    metrics_register_counter(reg, \"auth_requests_total\",\n        \"Number of authentication requests, labelled by outcome.\")\n    metrics_register_histogram(reg, \"auth_latency_seconds\",\n        \"Server-side latency for auth requests.\",\n        [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0])\n    return reg\n}\n\npub fn stdout_exporter(span: map) {\n    println(\"span \" + span[\"name\"] + \" status=\" + span[\"status\"])\n}\n\npub fn build_tracer() -> map {\n    return tracing_new_tracer(\"auth-server\", stdout_exporter, tracing_always_sample)\n}\n\n// -- Signup ---------------------------------------------------------\n\n/// Hash a new password with the `sensitive` profile.\npub fn signup(password: str) -> str {\n    return argon2_hash(password, argon2_profile_sensitive())\n}\n\n// -- Login ----------------------------------------------------------\n\n/// Authenticate `(user, password, totp_code)`. Returns [ok, token_or_error].\npub fn login(ctx: map, user: str, password: str, totp_code: str,\n             stored_hash: str, totp_secret: list, jwt_key: list) -> list {\n    let span = tracing_start(ctx[\"tracer\"], \"auth.login\", nil, \"server\", {})\n    tracing_set_attr(span, \"user\", user)\n\n    let started = time_mono_now()\n    let lbl = {}\n    lbl[\"outcome\"] = \"pending\"\n\n    if not argon2_verify(password, stored_hash) {\n        lbl[\"outcome\"] = \"bad_password\"\n        metrics_inc(ctx[\"metrics\"], \"auth_requests_total\", lbl, 1.0)\n        metrics_observe(ctx[\"metrics\"], \"auth_latency_seconds\",\n            lbl, time_mono_now() - started)\n        tracing_end_error(span, \"bad_password\")\n        return [false, \"invalid_credentials\"]\n    }\n\n    if not totp_verify(totp_secret, totp_code, -1, 30, 6, 1, \"sha1\") {\n        lbl[\"outcome\"] = \"bad_totp\"\n        metrics_inc(ctx[\"metrics\"], \"auth_requests_total\", lbl, 1.0)\n        metrics_observe(ctx[\"metrics\"], \"auth_latency_seconds\",\n            lbl, time_mono_now() - started)\n        tracing_end_error(span, \"bad_totp\")\n        return [false, \"invalid_2fa\"]\n    }\n\n    let extras = {}\n    extras[\"role\"] = \"user\"\n    let token = jwt_issue(user, jwt_key, 3600, extras, \"HS256\")\n\n    lbl[\"outcome\"] = \"ok\"\n    metrics_inc(ctx[\"metrics\"], \"auth_requests_total\", lbl, 1.0)\n    metrics_observe(ctx[\"metrics\"], \"auth_latency_seconds\",\n        lbl, time_mono_now() - started)\n    tracing_end_ok(span)\n    return [true, token]\n}\n\n// -- Verify session -------------------------------------------------\n\n/// Validate a bearer JWT on every protected request.\npub fn authorize(ctx: map, bearer: str, jwt_key: list) -> list {\n    let span = tracing_start(ctx[\"tracer\"], \"auth.verify\", nil, \"server\", {})\n    let opts = {}\n    opts[\"leeway_s\"] = 5\n    let result = jwt_verify_hmac(bearer, jwt_key, \"HS256\", opts)\n    if result[0] {\n        tracing_end_ok(span)\n    } else {\n        tracing_end_error(span, result[1])\n    }\n    return result\n}\n",
    spiral_cache_cluster: "// ===================================================================\n// examples/spiral_cache_cluster.ltl\n// -------------------------------------------------------------------\n// Spiral Wave 3 integrative demo \u2014 a tiny replicated cache cluster:\n//\n//   * consistent_hash \u2014 pick the primary + replicas for each key\n//   * bloom           \u2014 per-node membership summary for cheap \"do I\n//                        have this key?\" probes before touching RAM\n//   * resp            \u2014 the protocol we speak to clients\n//   * merkle          \u2014 periodic cross-replica reconciliation\n//   * protobuf        \u2014 on-wire replication log entries\n//\n// Everything runs in-memory; no sockets, no threads.  The goal is to\n// show the modules composing sensibly.\n// ===================================================================\n\nimport resp\nimport protobuf\nimport bloom\nimport consistent_hash\nimport merkle\n\n// -- Cluster state ---------------------------------------------------\n\npub fn new_node(name: str) -> map {\n    let n = {}\n    n[\"name\"]   = name\n    n[\"store\"]  = {}\n    n[\"log\"]    = []   // list of protobuf-encoded replication entries\n    n[\"filter\"] = bloom_new_filter(1024, 4)\n    return n\n}\n\npub fn new_cluster(names: list, vnodes: int, replicas: int) -> map {\n    let c = {}\n    c[\"ring\"]     = consistent_hash_new_ring(vnodes)\n    c[\"replicas\"] = replicas\n    c[\"nodes\"]    = {}\n    let i = 0\n    while i < len(names) {\n        consistent_hash_add_node(c[\"ring\"], names[i])\n        c[\"nodes\"][names[i]] = new_node(names[i])\n        i = i + 1\n    }\n    return c\n}\n\n// -- SET / GET -------------------------------------------------------\n\npub fn owners_for(c: map, key: str) -> list {\n    return consistent_hash_lookup_n(c[\"ring\"], key, c[\"replicas\"])\n}\n\npub fn cluster_set(c: map, key: str, value: str) -> list {\n    let owners = owners_for(c, key)\n    let i = 0\n    while i < len(owners) {\n        let n = c[\"nodes\"][owners[i]]\n        n[\"store\"][key] = value\n        bloom_add(n[\"filter\"], key)\n        // Append a replication log entry:\n        //   field 1 (string) = key\n        //   field 2 (string) = value\n        let entry = protobuf_enc_string(1, key) + protobuf_enc_string(2, value)\n        n[\"log\"] = n[\"log\"] + [entry]\n        i = i + 1\n    }\n    return owners\n}\n\npub fn cluster_get(c: map, key: str) -> str {\n    let owners = owners_for(c, key)\n    let i = 0\n    while i < len(owners) {\n        let n = c[\"nodes\"][owners[i]]\n        // Fast-path: bloom says \"definitely not\" \u2014 skip the map lookup.\n        if not bloom_contains_key(n[\"filter\"], key) {\n            i = i + 1\n            continue\n        }\n        if contains(keys(n[\"store\"]), key) {\n            return n[\"store\"][key]\n        }\n        i = i + 1\n    }\n    return \"\"\n}\n\n// -- RESP surface ----------------------------------------------------\n\n/// Handle a single parsed command (list of bulk-string argv).\npub fn handle_command(c: map, argv: list) -> str {\n    if len(argv) == 0 {\n        return resp_enc_error(\"ERR empty command\")\n    }\n    let verb = argv[0]\n    if verb == \"PING\" {\n        return resp_enc_simple_string(\"PONG\")\n    }\n    if verb == \"SET\" && len(argv) == 3 {\n        cluster_set(c, argv[1], argv[2])\n        return resp_enc_simple_string(\"OK\")\n    }\n    if verb == \"GET\" && len(argv) == 2 {\n        let v = cluster_get(c, argv[1])\n        if v == \"\" { return resp_enc_null_bulk() }\n        return resp_enc_bulk_string(v)\n    }\n    if verb == \"EXISTS\" && len(argv) == 2 {\n        let owners = owners_for(c, argv[1])\n        let any_has = false\n        let i = 0\n        while i < len(owners) {\n            if bloom_contains_key(c[\"nodes\"][owners[i]][\"filter\"], argv[1]) {\n                any_has = true\n            }\n            i = i + 1\n        }\n        if any_has { return resp_enc_integer(1) }\n        return resp_enc_integer(0)\n    }\n    return resp_enc_error(\"ERR unknown command\")\n}\n\n// -- Replication reconciliation --------------------------------------\n\n/// Compute a Merkle root over one node's replication log so replicas\n/// can detect divergence in O(log n) exchanged hashes.\npub fn node_log_root(node: map) -> str {\n    let strs = []\n    let i = 0\n    while i < len(node[\"log\"]) {\n        // Each log entry is a list of bytes; render as a stable string.\n        let entry = node[\"log\"][i]\n        let s = \"\"\n        let j = 0\n        while j < len(entry) {\n            s = s + chr(entry[j])\n            j = j + 1\n        }\n        strs = strs + [s]\n        i = i + 1\n    }\n    let t = merkle_build_default(strs)\n    return t[\"root\"]\n}\n\npub fn replicas_agree(c: map, key: str) -> bool {\n    let owners = owners_for(c, key)\n    if len(owners) < 2 { return true }\n    let r0 = node_log_root(c[\"nodes\"][owners[0]])\n    let i = 1\n    while i < len(owners) {\n        if node_log_root(c[\"nodes\"][owners[i]]) != r0 {\n            return false\n        }\n        i = i + 1\n    }\n    return true\n}\n\n// -- Driver ----------------------------------------------------------\n\npub fn demo() -> map {\n    let c = new_cluster([\"cache-a\", \"cache-b\", \"cache-c\", \"cache-d\"], 64, 2)\n\n    cluster_set(c, \"user:1\",     \"alice\")\n    cluster_set(c, \"user:2\",     \"bob\")\n    cluster_set(c, \"session:42\", \"token-xyz\")\n\n    let result = {}\n    result[\"owners_user_1\"] = owners_for(c, \"user:1\")\n    result[\"get_user_1\"]    = cluster_get(c, \"user:1\")\n    result[\"get_missing\"]   = cluster_get(c, \"no_such_key\")\n\n    // Simulate a RESP request round-trip:\n    let req = resp_enc_command([\"SET\", \"greeting\", \"hello spiral\"])\n    let decoded = resp_decode(req, 0)\n    let reply  = handle_command(c, decoded[0])\n    result[\"resp_reply\"] = reply\n\n    result[\"replicas_agree\"] = replicas_agree(c, \"user:1\")\n    return result\n}\n",
    spiral_chat_relay: "// ===================================================================\n// examples/spiral_chat_relay.ltl\n// -------------------------------------------------------------------\n// Spiral Wave 2 integrative demo \u2014 a tiny chat-relay skeleton that\n// wires together:\n//   * websocket  \u2014 RFC 6455 frame codec + handshake\n//   * graphql    \u2014 parse the client's subscription query\n//   * metrics    \u2014 in-process counters (Wave 1)\n//   * tracing    \u2014 span-per-message (Wave 1)\n//\n// No real sockets; the \"transport\" is a pair of in-memory lists so\n// the whole thing runs under any harness that can execute pure-Ltl.\n// ===================================================================\n\nimport websocket\nimport graphql\nimport metrics\nimport tracing\n\n// -- Fake transport --------------------------------------------------\n\npub fn new_transport() -> map {\n    let t = {}\n    t[\"inbox\"]  = []     // bytes delivered \"from\" the client\n    t[\"outbox\"] = []     // bytes we've \"sent\" to the client\n    return t\n}\n\npub fn tx_send(t: map, buf: list) {\n    t[\"outbox\"] = t[\"outbox\"] + buf\n}\n\npub fn tx_feed(t: map, buf: list) {\n    t[\"inbox\"] = t[\"inbox\"] + buf\n}\n\n// -- Handshake -------------------------------------------------------\n\n/// Compute the Sec-WebSocket-Accept header value for a client key.\npub fn handshake_accept(client_key: str) -> str {\n    return websocket_compute_accept(client_key)\n}\n\n// -- Session state ---------------------------------------------------\n\npub fn new_session(name: str) -> map {\n    let s = {}\n    s[\"name\"]    = name\n    s[\"query\"]   = nil   // parsed graphql op\n    s[\"fields\"]  = []    // field names the subscription asked for\n    s[\"msgs\"]    = 0\n    return s\n}\n\n// -- Handle a single text frame --------------------------------------\n\n/// Consume one frame's worth of payload. If it is a GraphQL\n/// `subscription` document we remember the selected fields; anything\n/// else is broadcast back framed as a text message.\npub fn handle_frame(session: map, reg: map, payload: list) -> list {\n    let span = tracing_start_span(reg, \"handle_frame\")\n    metrics_counter_inc(reg, \"chat_frames_total\", 1)\n    let text = \"\"\n    let i = 0\n    while i < len(payload) {\n        text = text + chr(payload[i])\n        i = i + 1\n    }\n    let reply = \"\"\n    if starts_with(text, \"subscription\") || starts_with(text, \"query\") {\n        let op = graphql_parse(text)\n        session[\"query\"] = op\n        let fnames = []\n        for sel in op[\"selections\"] {\n            fnames = fnames + [sel[\"field\"]]\n        }\n        session[\"fields\"] = fnames\n        reply = \"ack: subscribed to \" + join(fnames, \",\")\n        metrics_counter_inc(reg, \"chat_subscriptions_total\", 1)\n    } else {\n        session[\"msgs\"] = session[\"msgs\"] + 1\n        reply = session[\"name\"] + \": \" + text\n        metrics_counter_inc(reg, \"chat_messages_total\", 1)\n    }\n    let out = websocket_encode_frame(1, websocket_op_text(), bytes_of(reply))\n    tracing_end_span(reg, span)\n    return out\n}\n\n// -- Driver ----------------------------------------------------------\n\n/// Demo entry point: build an in-memory chat, push two frames\n/// through it and return a summary map.\npub fn demo() -> map {\n    let reg = metrics_registry()\n    tracing_init(reg)\n    metrics_counter_register(reg, \"chat_frames_total\", \"Frames handled\")\n    metrics_counter_register(reg, \"chat_subscriptions_total\", \"Subscriptions accepted\")\n    metrics_counter_register(reg, \"chat_messages_total\", \"Chat messages relayed\")\n\n    let t = new_transport()\n    let s = new_session(\"alice\")\n\n    // Client subscribes via a GraphQL document.\n    let sub_doc = \"subscription { messages room user text } \"\n    let f1 = websocket_encode_frame(1, websocket_op_text(), bytes_of(sub_doc))\n    tx_feed(t, f1)\n    let frame1 = websocket_decode_frame(t[\"inbox\"])\n    let reply1 = handle_frame(s, reg, frame1[\"payload\"])\n    tx_send(t, reply1)\n\n    // Client sends a chat line.\n    let msg = \"hello spiral\"\n    let f2 = websocket_encode_frame(1, websocket_op_text(), bytes_of(msg))\n    tx_feed(t, f2)\n    // Skip past frame1 we already consumed.\n    let rest = slice(t[\"inbox\"], frame1[\"consumed\"], len(t[\"inbox\"]))\n    let frame2 = websocket_decode_frame(rest)\n    let reply2 = handle_frame(s, reg, frame2[\"payload\"])\n    tx_send(t, reply2)\n\n    let result = {}\n    result[\"fields\"]   = s[\"fields\"]\n    result[\"msgs\"]     = s[\"msgs\"]\n    result[\"outbytes\"] = len(t[\"outbox\"])\n    result[\"metrics\"]  = metrics_render_prometheus(reg)\n    return result\n}\n",
    spiral_columnar: "// ===================================================================\n// examples/spiral_columnar.ltl  \u2014  Wave 8 demo\n// One column of integers + one column of strings encoded through the\n// full columnar pipeline: dict + FoR + RLE + Arrow IPC + Parquet wrap.\n// ===================================================================\n\nfn main() {\n    print(\"=== Spiral Columnar (Wave 8) ===\")\n\n    // -- string column \u2192 dictionary encoding -----------------------\n    let cities = [\"NYC\",\"LA\",\"NYC\",\"SF\",\"LA\",\"NYC\",\"SF\",\"SF\",\"NYC\",\"LA\"]\n    let de = dict_encoding_encode(cities)\n    print(\"dict card  = \" + str(dict_encoding_cardinality(de)))\n    print(\"dict bits  = \" + str(dict_encoding_index_bit_width(de)))\n    print(\"indices    = \" + str(de[\"indices\"]))\n\n    // -- run-length on the dictionary indices ----------------------\n    let rle = run_length_encode_pairs(de[\"indices\"])\n    print(\"RLE pairs  = \" + str(len(rle)))\n    print(\"RLE ratio  = \" + str(run_length_ratio_permille(len(de[\"indices\"]),\n                                                            len(rle))) + \"\u2030\")\n\n    // -- timestamp column \u2192 delta-of-delta -------------------------\n    let ts = [1745500000, 1745500030, 1745500060, 1745500091,\n              1745500120, 1745500150, 1745500180]\n    let dod = frame_of_reference_encode_dod(ts)\n    print(\"first ts   = \" + str(dod[\"first\"]))\n    print(\"dods       = \" + str(dod[\"dods\"]))\n    let back = frame_of_reference_decode_dod(dod)\n    print(\"dod ok     = \" + str(back[6] == ts[6]))\n\n    // -- pack into Arrow IPC frames --------------------------------\n    let utf8 = arrow_ipc_buffers_utf8(de[\"dictionary\"])\n    let idx_buf = arrow_ipc_buffer_i32(de[\"indices\"])\n    let frame = arrow_ipc_frame_message([], utf8[0] + utf8[1] + idx_buf)\n    print(\"arrow IPC frame = \" + str(len(frame)) + \"B\")\n\n    // -- wrap as a (toy) Parquet file ------------------------------\n    let file = parquet_assemble_file(idx_buf, [])\n    print(\"parquet file    = \" + str(len(file)) + \"B (PAR1 ... PAR1)\")\n    let fp = parquet_parse_footer_pointer(file)\n    print(\"parquet footer @\" + str(fp[\"footer_offset\"])\n          + \" len=\" + str(fp[\"footer_len\"]))\n}\n\nmain()\n",
    spiral_event_bus: "// ===================================================================\n// examples/spiral_event_bus.ltl\n// -------------------------------------------------------------------\n// Wave 5 integrative demo: a single in-memory event bus that speaks\n// five protocol dialects at its edges.  The bus itself is plain\n// Lateralus; the stdlib modules provide the byte/line codecs that\n// adapt each incoming client.\n//\n//     Kafka producer  \u2500\u2510\n//     AMQP publisher  \u2500\u2524\n//     MQTT 5 client   \u2500\u253c\u2500\u2500\u25ba  [ Spiral Event Bus ]  \u2500\u2500\u25ba fan-out to\n//     STOMP client    \u2500\u2524          (topic router)        subscribers\n//     NATS publisher  \u2500\u2518\n// ===================================================================\n\n// -- Tiny topic router ---------------------------------------------\n\nlet BUS_SUBS = []  // list of [topic, callback_tag]\nlet BUS_LOG  = []  // list of [protocol, topic, bytes_len, summary]\n\nfn bus_subscribe(topic: str, tag: str) {\n    BUS_SUBS = BUS_SUBS + [[topic, tag]]\n}\n\nfn bus_publish(protocol: str, topic: str, payload: str) {\n    BUS_LOG = BUS_LOG + [[protocol, topic, len(payload), slice(payload, 0, 32)]]\n    let i = 0\n    while i < len(BUS_SUBS) {\n        let s = BUS_SUBS[i]\n        if s[0] == topic || s[0] == \"*\" {\n            print(\"  \u2192 deliver to \" + s[1] + \" on '\" + topic + \"' (\" + str(len(payload)) + \"B)\")\n        }\n        i = i + 1\n    }\n}\n\n// -- Kafka edge ----------------------------------------------------\n\nfn edge_kafka(topic: str, key: str, value: str) {\n    // Build a produce-request-ish frame just to exercise the codec.\n    let hdr = kafka_wire_request_header_v1(kafka_wire_api_produce(), 9, 42, \"demo\")\n    let frame = kafka_wire_frame_request(hdr + kafka_wire_enc_string(topic)\n                                              + kafka_wire_enc_string(key)\n                                              + kafka_wire_enc_bytes(bytes_of(value)))\n    print(\"kafka frame bytes=\" + str(len(frame)))\n    bus_publish(\"kafka\", topic, value)\n}\n\n// -- AMQP edge -----------------------------------------------------\n\nfn edge_amqp(exchange: str, routing_key: str, body: str) {\n    let args = amqp_basic_publish_args(exchange, routing_key)\n    let frames = amqp_publish_frames(1, args, bytes_of(body))\n    print(\"amqp frames=\" + str(len(frames)) + \" rk=\" + routing_key)\n    bus_publish(\"amqp\", routing_key, body)\n}\n\n// -- MQTT 5 edge ---------------------------------------------------\n\nfn edge_mqtt(topic: str, qos: int, body: str) {\n    let props = []\n    props = props + mqtt5_prop_utf8(mqtt5_pi_content_type(), \"text/plain\")\n    let pkt = mqtt5_publish(topic, qos, false, false, 7, props, bytes_of(body))\n    print(\"mqtt packet bytes=\" + str(len(pkt)) + \" qos=\" + str(qos))\n    bus_publish(\"mqtt\", topic, body)\n}\n\n// -- STOMP edge ----------------------------------------------------\n\nfn edge_stomp(destination: str, body: str) {\n    let frame = stomp_send(destination, \"text/plain\", body)\n    let parsed = stomp_parse_frame(frame)\n    print(\"stomp frame '\" + parsed[\"command\"] + \"' dest=\" + destination)\n    bus_publish(\"stomp\", destination, body)\n}\n\n// -- NATS edge -----------------------------------------------------\n\nfn edge_nats(subject: str, body: str) {\n    let line = nats_pub_msg(subject, \"\", body)\n    print(\"nats wire bytes=\" + str(len(line)))\n    bus_publish(\"nats\", subject, body)\n}\n\n// -- Demo ----------------------------------------------------------\n\nfn main() {\n    print(\"=== Spiral Event Bus (Wave 5) ===\")\n    bus_subscribe(\"orders.created\", \"order-service\")\n    bus_subscribe(\"*\",              \"audit-log\")\n\n    edge_kafka(\"orders.created\", \"order-42\", \"{\\\"id\\\":42,\\\"total\\\":19.95}\")\n    edge_amqp (\"app.exchange\",   \"orders.created\", \"{\\\"id\\\":43}\")\n    edge_mqtt (\"orders.created\", 1, \"{\\\"id\\\":44}\")\n    edge_stomp(\"/topic/orders.created\",      \"{\\\"id\\\":45}\")\n    edge_nats (\"orders.created\", \"{\\\"id\\\":46}\")\n\n    print(\"---\")\n    print(\"bus log entries: \" + str(len(BUS_LOG)))\n    let i = 0\n    while i < len(BUS_LOG) {\n        let e = BUS_LOG[i]\n        print(\"  \" + e[0] + \"  \" + e[1] + \"  \" + str(e[2]) + \"B\")\n        i = i + 1\n    }\n}\n\nmain()\n",
    spiral_handshake: "// ===================================================================\n// examples/spiral_handshake.ltl  \u2014  Wave 9 demo\n// X25519 ephemeral key exchange \u2192 HKDF expansion \u2192 ChaCha20+Poly1305\n// AEAD seal \u2014 i.e. the WireGuard / Noise / TLS 1.3 KEM core.\n// ===================================================================\n\nfn hex_byte(b: int) -> str {\n    let hex = \"0123456789abcdef\"\n    return char_at(hex, (b >> 4) & 0xf) + char_at(hex, b & 0xf)\n}\n\nfn hex_dump(bytes: list) -> str {\n    let s = \"\"\n    let i = 0\n    while i < len(bytes) {\n        s = s + hex_byte(bytes[i])\n        i = i + 1\n    }\n    return s\n}\n\nfn make_secret(seed: int) -> list {\n    let s = []\n    let i = 0\n    while i < 32 { s = s + [(seed + i * 7) & 0xff]; i = i + 1 }\n    return s\n}\n\nfn main() {\n    print(\"=== Spiral Handshake (Wave 9) ===\")\n\n    // -- 1. X25519 ephemeral key exchange --------------------------\n    let alice_sk = make_secret(0x42)\n    let bob_sk   = make_secret(0xA5)\n    let alice_pk = x25519_derive_public(alice_sk)\n    let bob_pk   = x25519_derive_public(bob_sk)\n    let shared_a = x25519_scalar_mult(alice_sk, bob_pk)\n    let shared_b = x25519_scalar_mult(bob_sk,   alice_pk)\n    print(\"alice_pk = \" + slice(hex_dump(alice_pk), 0, 16) + \"...\")\n    print(\"shared agree = \" + str(hex_dump(shared_a) == hex_dump(shared_b)))\n\n    // -- 2. BLAKE2s the shared secret as a transcript hash ---------\n    let transcript = blake2s_hash256(shared_a + alice_pk + bob_pk)\n    print(\"transcript = \" + slice(hex_dump(transcript), 0, 16) + \"...\")\n\n    // -- 3. HKDF expansion \u2192 32-byte session key + 12-byte nonce ---\n    let prk = hkdf_extract(transcript, shared_a)\n    let key = hkdf_expand(prk, bytes_of(\"session-key\"), 32)\n    let nonce = hkdf_expand(prk, bytes_of(\"session-nonce\"), 12)\n    print(\"session_key = \" + slice(hex_dump(key), 0, 16) + \"...\")\n\n    // -- 4. ChaCha20 + Poly1305 seal a payload ---------------------\n    let payload = bytes_of(\"hello from the spiral!\")\n    // RFC 8439: derive Poly1305 one-time key from ChaCha20 block 0.\n    let p1key = slice(chacha20_block(key, nonce, 0), 0, 32)\n    let ct    = chacha20_xor(key, nonce, 1, payload)\n    let tag   = poly1305_mac(p1key, ct)\n    print(\"ciphertext  = \" + hex_dump(ct))\n    print(\"tag         = \" + hex_dump(tag))\n\n    // -- 5. Round-trip on the receiver side -----------------------\n    let ok    = poly1305_verify(tag, poly1305_mac(p1key, ct))\n    let pt    = chacha20_xor(key, nonce, 1, ct)\n    print(\"tag verify  = \" + str(ok))\n    print(\"decrypted   = \" + str(pt == payload))\n}\n\nmain()\n",
    spiral_identity_broker: "// ===================================================================\n// examples/spiral_identity_broker.ltl\n// -------------------------------------------------------------------\n// Spiral Wave 4 integrative demo \u2014 a tiny identity broker that:\n//\n//   * speaks OAuth 2.0 / OIDC outward to upstream IdPs\n//     (oauth2_authorization_url + pkce + oidc_verify_id_token)\n//   * supports SAML IdPs as a fallback binding\n//     (saml_render_authn_request + saml_redirect_binding_url)\n//   * issues first-party WebAuthn passkeys for session step-up\n//     (webauthn_new_authentication_options)\n//   * exposes a SCIM 2.0 surface for provisioning users + groups\n//     (scim_new_user, scim_list_response, scim_eval_filter)\n//\n// Everything runs in-memory; no sockets.  The goal is to show the\n// modules composing sensibly.\n// ===================================================================\n\nimport oauth2\nimport oidc\nimport saml\nimport webauthn\nimport scim\n\n// -- Broker state ---------------------------------------------------\n\npub fn new_broker() -> map {\n    let b = {}\n    b[\"oidc_client\"]   = nil\n    b[\"saml_sp\"]       = {}\n    b[\"users\"]         = []     // list of SCIM User resources\n    b[\"sessions\"]      = {}     // session_id \u2192 {user_id, step_up}\n    b[\"webauthn_keys\"] = {}     // user_id \u2192 [credential_id, ...]\n    return b\n}\n\n// -- Upstream OIDC --------------------------------------------------\n\npub fn configure_oidc_from_discovery(b: map, client_id: str, secret: str,\n                                      redirect_uri: str, disco: map) -> map {\n    b[\"oidc_client\"] = oidc_client_from_discovery(client_id, secret,\n                                                  redirect_uri,\n                                                  [\"profile\", \"email\"],\n                                                  disco)\n    return b\n}\n\npub fn begin_oidc_login(b: map, state: str, nonce: str,\n                         pkce_challenge: str) -> str {\n    return oidc_authorization_url(b[\"oidc_client\"], state, nonce, pkce_challenge)\n}\n\n// -- Upstream SAML --------------------------------------------------\n\npub fn configure_saml(b: map, sp_entity_id: str, acs_url: str,\n                       idp_sso_url: str) {\n    let sp = {}\n    sp[\"sp_entity_id\"] = sp_entity_id\n    sp[\"acs_url\"]      = acs_url\n    sp[\"idp_sso_url\"]  = idp_sso_url\n    b[\"saml_sp\"] = sp\n}\n\npub fn begin_saml_login(b: map, request_id: str, issue_instant: str,\n                         relay_state: str) -> str {\n    let req = saml_new_authn_request(b[\"saml_sp\"][\"sp_entity_id\"],\n                                     b[\"saml_sp\"][\"acs_url\"],\n                                     b[\"saml_sp\"][\"idp_sso_url\"],\n                                     request_id, issue_instant)\n    let xml = saml_render_authn_request(req)\n    return saml_redirect_binding_url(xml, nil, relay_state,\n                                     b[\"saml_sp\"][\"idp_sso_url\"])\n}\n\n// -- SCIM provisioning ----------------------------------------------\n\npub fn scim_create_user(b: map, id: str, username: str,\n                         given: str, family: str, email: str) -> map {\n    let u = scim_new_user(id, username, true)\n    u = scim_with_name(u, given, family, given + \" \" + family)\n    u = scim_with_email(u, email, \"work\", true)\n    b[\"users\"] = b[\"users\"] + [u]\n    return u\n}\n\npub fn scim_search(b: map, filter_expr: str) -> map {\n    let ast = scim_parse_filter(filter_expr)\n    let matched = []\n    let i = 0\n    while i < len(b[\"users\"]) {\n        if scim_eval_filter(ast, b[\"users\"][i]) {\n            matched = matched + [b[\"users\"][i]]\n        }\n        i = i + 1\n    }\n    return scim_list_response(matched, 1, len(matched), len(matched))\n}\n\npub fn scim_apply_patch(b: map, user_id: str, patch_doc: map) -> map {\n    let target_idx = 0 - 1\n    let i = 0\n    while i < len(b[\"users\"]) {\n        if b[\"users\"][i][\"id\"] == user_id {\n            target_idx = i\n        }\n        i = i + 1\n    }\n    if target_idx < 0 {\n        return scim_error(404, \"\", \"user not found\")\n    }\n    let target = b[\"users\"][target_idx]\n    let ops = scim_parse_patch(patch_doc)\n    let j = 0\n    while j < len(ops) {\n        let op = ops[j]\n        let name = op[0]\n        let path = op[1]\n        let value = op[2]\n        if name == \"replace\" && path != \"\" {\n            target[path] = value\n        }\n        if name == \"remove\" && path != \"\" {\n            // Mark inactive rather than actually deleting keys.\n            if path == \"active\" {\n                target[\"active\"] = false\n            }\n        }\n        j = j + 1\n    }\n    b[\"users\"][target_idx] = target\n    return target\n}\n\n// -- WebAuthn step-up -----------------------------------------------\n\npub fn issue_passkey_challenge(b: map, user_id: str,\n                                challenge_b64url: str) -> map {\n    let allow = []\n    if contains(keys(b[\"webauthn_keys\"]), user_id) {\n        allow = b[\"webauthn_keys\"][user_id]\n    }\n    return webauthn_new_authentication_options(\"spiral.example\",\n                                                challenge_b64url,\n                                                allow, 60000)\n}\n\npub fn register_passkey(b: map, user_id: str, credential_id_b64url: str) {\n    let existing = []\n    if contains(keys(b[\"webauthn_keys\"]), user_id) {\n        existing = b[\"webauthn_keys\"][user_id]\n    }\n    b[\"webauthn_keys\"][user_id] = existing + [credential_id_b64url]\n}\n\n// -- Driver ----------------------------------------------------------\n\npub fn demo() -> map {\n    let b = new_broker()\n\n    // Upstream OIDC from a (stub) discovery document.\n    let disco = {}\n    disco[\"issuer\"]                 = \"https://login.example.com\"\n    disco[\"authorization_endpoint\"] = \"https://login.example.com/authorize\"\n    disco[\"token_endpoint\"]         = \"https://login.example.com/token\"\n    disco[\"jwks_uri\"]               = \"https://login.example.com/jwks.json\"\n    disco[\"scopes_supported\"]       = [\"openid\", \"profile\", \"email\"]\n    let parsed = oidc_parse_discovery(disco)\n    configure_oidc_from_discovery(b, \"spiral-broker\", \"shh\",\n                                  \"https://broker.example/callback\", parsed)\n\n    // Upstream SAML for the legacy tenant.\n    configure_saml(b, \"https://broker.example/saml\",\n                   \"https://broker.example/saml/acs\",\n                   \"https://idp.legacy.example/sso\")\n\n    // Provision two users via SCIM.\n    scim_create_user(b, \"u-1\", \"alice\", \"Alice\", \"Zero\", \"alice@example.com\")\n    scim_create_user(b, \"u-2\", \"bob\",   \"Bob\",   \"One\",  \"bob@example.com\")\n\n    // Register a passkey for Alice.\n    register_passkey(b, \"u-1\", \"cred-alice-1\")\n\n    let result = {}\n    result[\"oidc_login_url\"] = begin_oidc_login(b, \"csrf-state-xyz\",\n                                                \"nonce-abc\", \"pkce-chal-123\")\n    result[\"saml_login_url\"] = begin_saml_login(b, \"_spiral-001\",\n                                                \"2026-04-24T12:00:00Z\",\n                                                \"rs-1\")\n    result[\"scim_search\"]    = scim_search(b, \"userName eq \\\"alice\\\"\")\n    result[\"passkey_opts\"]   = issue_passkey_challenge(b, \"u-1\", \"ch-b64url\")\n    return result\n}\n",
    spiral_ranking: "// examples/spiral_ranking.ltl \u2014 demo for stdlib/ranking.ltl (Wave 11)\n// -----------------------------------------------------------------------------\n// Self-contained search ranker built on BM25 + TF-IDF cosine similarity.\n// Inlines the ranking module's core (since `import stdlib.ranking` does not\n// resolve in the runner yet \u2014 same harness gap noted in earlier waves).\n// -----------------------------------------------------------------------------\n\n// ----- minimal inlined ranking core (mirrors stdlib/ranking.ltl) --------------\n\nfn ascii_lower(c: str) -> str {\n    if c == \"A\" { return \"a\" } if c == \"B\" { return \"b\" } if c == \"C\" { return \"c\" }\n    if c == \"D\" { return \"d\" } if c == \"E\" { return \"e\" } if c == \"F\" { return \"f\" }\n    if c == \"G\" { return \"g\" } if c == \"H\" { return \"h\" } if c == \"I\" { return \"i\" }\n    if c == \"J\" { return \"j\" } if c == \"K\" { return \"k\" } if c == \"L\" { return \"l\" }\n    if c == \"M\" { return \"m\" } if c == \"N\" { return \"n\" } if c == \"O\" { return \"o\" }\n    if c == \"P\" { return \"p\" } if c == \"Q\" { return \"q\" } if c == \"R\" { return \"r\" }\n    if c == \"S\" { return \"s\" } if c == \"T\" { return \"t\" } if c == \"U\" { return \"u\" }\n    if c == \"V\" { return \"v\" } if c == \"W\" { return \"w\" } if c == \"X\" { return \"x\" }\n    if c == \"Y\" { return \"y\" } if c == \"Z\" { return \"z\" }\n    return c\n}\n\nfn is_word_char(c: str) -> bool {\n    if c == \"0\" || c == \"1\" || c == \"2\" || c == \"3\" || c == \"4\" { return true }\n    if c == \"5\" || c == \"6\" || c == \"7\" || c == \"8\" || c == \"9\" { return true }\n    if c == \"a\" || c == \"b\" || c == \"c\" || c == \"d\" || c == \"e\" { return true }\n    if c == \"f\" || c == \"g\" || c == \"h\" || c == \"i\" || c == \"j\" { return true }\n    if c == \"k\" || c == \"l\" || c == \"m\" || c == \"n\" || c == \"o\" { return true }\n    if c == \"p\" || c == \"q\" || c == \"r\" || c == \"s\" || c == \"t\" { return true }\n    if c == \"u\" || c == \"v\" || c == \"w\" || c == \"x\" || c == \"y\" { return true }\n    if c == \"z\" || c == \"_\" { return true }\n    return false\n}\n\nfn tokenize(text: str) -> list {\n    let out = []\n    let cur = \"\"\n    let i = 0\n    while i < len(text) {\n        let c = ascii_lower(slice(text, i, i + 1))\n        if is_word_char(c) {\n            cur = cur + c\n        } else {\n            if len(cur) > 0 { out = out + [cur]; cur = \"\" }\n        }\n        i = i + 1\n    }\n    if len(cur) > 0 { out = out + [cur] }\n    return out\n}\n\nfn term_freq(tokens: list) -> list {\n    let terms = []\n    let counts = []\n    let i = 0\n    while i < len(tokens) {\n        let t = tokens[i]\n        let found = -1\n        let j = 0\n        while j < len(terms) {\n            if terms[j] == t { found = j; j = len(terms) } else { j = j + 1 }\n        }\n        if found >= 0 { counts[found] = counts[found] + 1 }\n        else          { terms = terms + [t]; counts = counts + [1] }\n        i = i + 1\n    }\n    return [terms, counts]\n}\n\nfn tf_get(tf: list, term: str) -> int {\n    let terms = tf[0]\n    let counts = tf[1]\n    let i = 0\n    while i < len(terms) {\n        if terms[i] == term { return counts[i] }\n        i = i + 1\n    }\n    return 0\n}\n\nfn build_index(docs_text: list) -> list {\n    let docs_tf = []\n    let doc_lens = []\n    let total_len = 0\n    let i = 0\n    while i < len(docs_text) {\n        let toks = tokenize(docs_text[i])\n        let tf = term_freq(toks)\n        docs_tf = docs_tf + [tf]\n        doc_lens = doc_lens + [len(toks)]\n        total_len = total_len + len(toks)\n        i = i + 1\n    }\n    let n = len(docs_tf)\n    let avgdl = 0.0\n    if n > 0 { avgdl = (total_len * 1.0) / (n * 1.0) }\n    let df_terms = []\n    let df_counts = []\n    let d = 0\n    while d < n {\n        let terms = docs_tf[d][0]\n        let k = 0\n        while k < len(terms) {\n            let t = terms[k]\n            let f = -1\n            let m = 0\n            while m < len(df_terms) {\n                if df_terms[m] == t { f = m; m = len(df_terms) } else { m = m + 1 }\n            }\n            if f >= 0 { df_counts[f] = df_counts[f] + 1 }\n            else      { df_terms = df_terms + [t]; df_counts = df_counts + [1] }\n            k = k + 1\n        }\n        d = d + 1\n    }\n    return [docs_tf, doc_lens, avgdl, [df_terms, df_counts], n]\n}\n\nfn df_get(df: list, term: str) -> int {\n    let terms = df[0]\n    let counts = df[1]\n    let i = 0\n    while i < len(terms) {\n        if terms[i] == term { return counts[i] }\n        i = i + 1\n    }\n    return 0\n}\n\nfn ln_approx(x: float) -> float {\n    if x <= 0.0 { return -1.0e18 }\n    let y = (x - 1.0) / (x + 1.0)\n    let y2 = y * y\n    let s = y\n    let term = y\n    let i = 1\n    while i < 12 {\n        term = term * y2\n        s = s + term / ((2 * i + 1) * 1.0)\n        i = i + 1\n    }\n    return 2.0 * s\n}\n\nfn idf_bm25(df: int, n: int) -> float {\n    let num = (n - df) * 1.0 + 0.5\n    let den = df * 1.0 + 0.5\n    return ln_approx(num / den + 1.0)\n}\n\nfn bm25_term_score(idx: list, doc_i: int, term: str, k1: float, b: float) -> float {\n    let docs_tf = idx[0]\n    let doc_lens = idx[1]\n    let avgdl = idx[2]\n    let df = idx[3]\n    let n = idx[4]\n    let tf = tf_get(docs_tf[doc_i], term)\n    if tf == 0 { return 0.0 }\n    let idf = idf_bm25(df_get(df, term), n)\n    let dl = doc_lens[doc_i] * 1.0\n    let norm = 1.0 - b + b * (dl / avgdl)\n    let tf_f = tf * 1.0\n    return idf * (tf_f * (k1 + 1.0)) / (tf_f + k1 * norm)\n}\n\nfn bm25_score(idx: list, doc_i: int, query_tokens: list) -> float {\n    let total = 0.0\n    let i = 0\n    while i < len(query_tokens) {\n        total = total + bm25_term_score(idx, doc_i, query_tokens[i], 1.5, 0.75)\n        i = i + 1\n    }\n    return total\n}\n\nfn rank_bm25(idx: list, query: str) -> list {\n    let qtoks = tokenize(query)\n    let n = idx[4]\n    let scored = []\n    let i = 0\n    while i < n {\n        scored = scored + [[i, bm25_score(idx, i, qtoks)]]\n        i = i + 1\n    }\n    let a = 0\n    while a < len(scored) {\n        let best = a\n        let b = a + 1\n        while b < len(scored) {\n            if scored[b][1] > scored[best][1] { best = b }\n            b = b + 1\n        }\n        if best != a {\n            let tmp = scored[a]; scored[a] = scored[best]; scored[best] = tmp\n        }\n        a = a + 1\n    }\n    return scored\n}\n\n// ----- demo corpus ------------------------------------------------------------\n\nlet DOCS = [\n    \"Lateralus ships a batteries-included standard library with crypto, parquet, search, and observability primitives.\",\n    \"BM25 is a probabilistic ranking function used by search engines to rank documents by relevance.\",\n    \"ChaCha20-Poly1305 provides authenticated encryption and ships in the Lateralus stdlib.\",\n    \"Apache Parquet is a columnar storage format used in big data analytics.\",\n    \"The Aho-Corasick algorithm finds all occurrences of multiple patterns in linear time.\",\n    \"TF-IDF and cosine similarity power simple semantic search systems and document recommenders.\",\n    \"Lateralus runs on the C99 backend roughly sixty times faster than CPython on classic benchmarks.\"\n]\n\nfn fmt_float(x: float) -> str {\n    if x < 0.0 { x = 0.0 }\n    // Render via integer string of x*1000 to avoid float-division artefacts.\n    let scaled = x * 1000.0\n    let total_int = int(scaled)        // float truncation -> some numeric form\n    let s = str(total_int)\n    // strip a trailing \".0\" if str() printed one\n    let dot = -1\n    let i = 0\n    while i < len(s) {\n        if slice(s, i, i + 1) == \".\" { dot = i; i = len(s) }\n        else { i = i + 1 }\n    }\n    if dot >= 0 { s = slice(s, 0, dot) }\n    while len(s) < 4 { s = \"0\" + s }\n    let cut = len(s) - 3\n    let whole = slice(s, 0, cut)\n    let frac = slice(s, cut, len(s))\n    return whole + \".\" + frac\n}\n\nfn run_query(idx: list, query: str) {\n    print(\"\")\n    print(\"query: \\\"\" + query + \"\\\"\")\n    let ranked = rank_bm25(idx, query)\n    let i = 0\n    while i < len(ranked) && i < 3 {\n        let r = ranked[i]\n        let score = r[1]\n        if score > 0.0 {\n            print(\"  \" + fmt_float(score) + \"  \" + DOCS[r[0]])\n        }\n        i = i + 1\n    }\n}\n\nfn main() {\n    let idx = build_index(DOCS)\n    print(\"Indexed \" + str(idx[4]) + \" documents, avg length \" + fmt_float(idx[2]) + \" tokens\")\n\n    run_query(idx, \"stdlib crypto chacha\")\n    run_query(idx, \"ranking algorithm relevance\")\n    run_query(idx, \"columnar parquet analytics\")\n    run_query(idx, \"search aho corasick patterns\")\n}\n\nmain()\n",
    spiral_search: "// ===================================================================\n// examples/spiral_search.ltl  \u2014  Wave 10 demo\n// Mini full-text search engine wiring all five search primitives:\n//   - qgram inverted index picks candidate docs\n//   - levenshtein.bounded re-ranks with exact edit distance\n//   - aho_corasick highlights fixed phrases in the top result\n//   - suffix_array.longest_repeated reveals repeated motifs\n//   - simhash clusters near-duplicate docs\n// ===================================================================\n\nfn main() {\n    print(\"=== Spiral Search Engine (Wave 10) ===\")\n\n    let docs = [\n        \"The quick brown fox jumps over the lazy dog\",\n        \"A fast brown fox leaps over a sleepy dog\",\n        \"Lorem ipsum dolor sit amet, consectetur\",\n        \"the quick brown fox jumps over the lazy dog\",   // near-dup of 0\n        \"Completely unrelated text about matrices\"\n    ]\n\n    // -- 1. q-gram inverted index --------------------------------\n    let q = 3\n    let idx = qgram_build_index(docs, q)\n    let query_str = \"quick brown fox\"\n    let ranked = qgram_query(idx, query_str, q)\n    print(\"\")\n    print(\"q-gram candidates for \\\"\" + query_str + \"\\\":\")\n    let i = 0\n    while i < len(ranked) {\n        print(\"  doc \" + str(ranked[i][0]) + \" score=\" + str(ranked[i][1]))\n        i = i + 1\n    }\n\n    // -- 2. Re-rank top 3 with bounded levenshtein ---------------\n    print(\"\")\n    print(\"Levenshtein distance to query:\")\n    let k = 0\n    while k < len(ranked) && k < 3 {\n        let did = ranked[k][0]\n        let d = levenshtein_bounded(query_str, docs[did], 50)\n        print(\"  doc \" + str(did) + \" dist=\" + str(d))\n        k = k + 1\n    }\n\n    // -- 3. Aho-Corasick highlight --------------------------------\n    let phrases = [\"brown fox\", \"lazy dog\", \"quick\"]\n    let auto = aho_corasick_build(phrases)\n    let top_doc = docs[ranked[0][0]]\n    print(\"\")\n    print(\"Phrase hits in top doc: \" + top_doc)\n    let hits = aho_corasick_find_all_starts(auto, top_doc)\n    let h = 0\n    while h < len(hits) {\n        print(\"  pattern \" + str(hits[h][0]) + \" @ \" + str(hits[h][1]))\n        h = h + 1\n    }\n\n    // -- 4. Suffix array: longest repeated substring in corpus ---\n    let corpus = \"\"\n    let c = 0\n    while c < len(docs) { corpus = corpus + docs[c] + \" \"; c = c + 1 }\n    let lrs = suffix_array_longest_repeated(corpus)\n    print(\"\")\n    print(\"Longest repeated substring: \\\"\" + lrs + \"\\\"\")\n\n    // -- 5. SimHash near-duplicate clustering --------------------\n    let fps = simhash_fingerprint_all(docs)\n    print(\"\")\n    print(\"SimHash near-duplicate pairs (hamming <= 8):\")\n    let a = 0\n    while a < len(docs) {\n        let b = a + 1\n        while b < len(docs) {\n            let hd = simhash_hamming(fps[a], fps[b])\n            if hd <= 8 {\n                print(\"  \" + str(a) + \" ~ \" + str(b) + \" (hamming=\" + str(hd) + \")\")\n            }\n            b = b + 1\n        }\n        a = a + 1\n    }\n}\n\nmain()\n",
    spiral_speedway: "// ===================================================================\n// examples/spiral_speedway.ltl\n// -------------------------------------------------------------------\n// Wave 7 integrative demo \u2014 a single benchmark harness that exercises\n// every perf module introduced in this wave.\n//\n// This isn't about wall-clock numbers in the interpreter; it's about\n// demonstrating that the APIs compose into a sensible pipeline:\n//\n//   raw text \u2192 rope edits \u2192 byte hash \u2192 lz4 compress \u2192 roaring set\n//   of hashes \u2192 radix-sorted output\n// ===================================================================\n\nfn banner(s: str) {\n    print(\"-- \" + s + \" \" + repeat(\"-\", 48 - len(s)))\n}\n\nfn main() {\n    print(\"=== Spiral Speedway (Wave 7) ===\")\n\n    // -- rope: build a 2 KB document via 32 inserts -----------------\n    banner(\"rope\")\n    let r = rope_from_str(\"Lateralus \")\n    let i = 0\n    while i < 32 {\n        r = rope_insert(r, rope_length(r),\n                         \"block-\" + str(i) + \" spiralling outward. \")\n        i = i + 1\n    }\n    let doc = rope_to_str(r)\n    print(\"rope length = \" + str(len(doc)) + \" chars\")\n    print(\"first 60    = \" + slice(doc, 0, 60))\n\n    // -- xxhash every word ------------------------------------------\n    banner(\"xxhash\")\n    let words = split(doc, \" \")\n    let hashes = []\n    let j = 0\n    while j < len(words) {\n        hashes = hashes + [xxhash_hash64_str(words[j], 0)]\n        j = j + 1\n    }\n    print(\"words     = \" + str(len(words)))\n    print(\"h[0]      = \" + str(hashes[0]))\n    print(\"h[last]   = \" + str(hashes[len(hashes) - 1]))\n\n    // -- lz4 round-trip on the document bytes -----------------------\n    banner(\"lz4\")\n    let src_bytes = bytes_of(doc)\n    let packed = lz4_compress(src_bytes)\n    let back   = lz4_decompress(packed)\n    let ratio  = (len(packed) * 1000) / len(src_bytes)\n    print(\"raw  = \" + str(len(src_bytes)) + \"B\")\n    print(\"lz4  = \" + str(len(packed))   + \"B  (ratio \" + str(ratio) + \"\u2030)\")\n    print(\"round-trip ok = \" + str(len(back) == len(src_bytes)))\n\n    // -- roaring: the set of hashes (low32 only) --------------------\n    banner(\"roaring\")\n    let bm = roaring_new_bitmap()\n    let k = 0\n    while k < len(hashes) {\n        bm = roaring_add(bm, hashes[k] & 0xffffffff)\n        k = k + 1\n    }\n    print(\"cardinality = \" + str(roaring_cardinality(bm)))\n\n    // -- radix sort the low16 of each hash --------------------------\n    banner(\"radix_sort\")\n    let lo16s = []\n    k = 0\n    while k < len(hashes) {\n        lo16s = lo16s + [hashes[k] & 0xffff]\n        k = k + 1\n    }\n    let sorted_lo = radix_sort_radix_sort_u32(lo16s)\n    print(\"sorted[0..5] = \"\n          + str(sorted_lo[0]) + \" \"\n          + str(sorted_lo[1]) + \" \"\n          + str(sorted_lo[2]) + \" \"\n          + str(sorted_lo[3]) + \" \"\n          + str(sorted_lo[4]))\n}\n\nmain()\n",
    spiral_telemetry: "// ===================================================================\n// examples/spiral_telemetry.ltl\n// -------------------------------------------------------------------\n// Wave 6 integrative demo: a single event is observed through all\n// five telemetry dialects simultaneously.  Demonstrates that the\n// same numeric measurement can be serialised for Prometheus scrape,\n// Influx line ingest, StatsD UDP, logfmt stdout, and OTLP/JSON POST\n// \u2014 without any coupling between the emitters.\n// ===================================================================\n\nfn render_prometheus(req_count: int, latency_ms: int) -> str {\n    let out = \"\"\n    out = out + prometheus_metric_block(\n        \"http_requests_total\",\n        \"Total HTTP requests served\",\n        \"counter\",\n        [[[[\"method\", \"GET\"], [\"status\", \"200\"]], str(req_count)]])\n    out = out + prometheus_histogram_block(\n        \"http_request_duration_ms\",\n        \"Request duration in milliseconds\",\n        [[\"method\", \"GET\"]],\n        [[\"5\",    str(req_count)],\n         [\"50\",   str(req_count)],\n         [\"500\",  str(req_count)],\n         [\"+Inf\", str(req_count)]],\n        str(latency_ms * req_count),\n        str(req_count))\n    return out\n}\n\nfn render_influx(req_count: int, latency_ms: int, ts_ns: int) -> str {\n    return influx_line_line(\n        \"http_requests\",\n        [[\"method\", \"GET\"], [\"status\", \"200\"]],\n        [[\"count\",    influx_line_field_int(req_count)],\n         [\"latency\",  influx_line_field_int(latency_ms)]],\n        ts_ns)\n}\n\nfn render_statsd(req_count: int, latency_ms: int) -> list {\n    let lines = []\n    lines = lines + [statsd_counter(\"http.requests\", req_count, \"\",\n                                      [[\"method\", \"GET\"], [\"status\", \"200\"]])]\n    lines = lines + [statsd_timer(\"http.latency\", str(latency_ms), \"\",\n                                    [[\"method\", \"GET\"]])]\n    return lines\n}\n\nfn render_logfmt(req_count: int, latency_ms: int) -> str {\n    return logfmt_encode([\n        [\"ts\",      \"2026-04-24T12:34:56Z\"],\n        [\"level\",   \"info\"],\n        [\"msg\",     \"served request\"],\n        [\"method\",  \"GET\"],\n        [\"status\",  \"200\"],\n        [\"count\",   str(req_count)],\n        [\"latency\", str(latency_ms) + \"ms\"]\n    ])\n}\n\nfn render_otlp(req_count: int, latency_ms: int, ts_ns: int) -> map {\n    let res = opentelemetry_resource([\n        opentelemetry_attr_string(\"service.name\", \"spiral-demo\"),\n        opentelemetry_attr_string(\"service.version\", \"3.8.0\")\n    ])\n    let scope = opentelemetry_instrumentation_scope(\"lateralus.stdlib\", \"3.8.0\")\n\n    let span = opentelemetry_span(\n        \"4bf92f3577b34da6a3ce929d0e0e4736\", \"00f067aa0ba902b7\", \"\",\n        \"GET /api/v1/resource\",\n        opentelemetry_kind_server(),\n        ts_ns - latency_ms * 1000000, ts_ns,\n        [opentelemetry_attr_string(\"http.method\", \"GET\"),\n         opentelemetry_attr_int(\"http.status_code\", 200)],\n        opentelemetry_status_ok(), \"\")\n    let ss = opentelemetry_scope_spans(scope, [span])\n    let rs = opentelemetry_resource_spans(res, [ss])\n    return opentelemetry_trace_request([rs])\n}\n\nfn main() {\n    print(\"=== Spiral Telemetry (Wave 6) ===\")\n    let req_count = 42\n    let latency_ms = 12\n    let ts_ns = 1745500000000000000\n\n    print(\"--- prometheus /metrics ---\")\n    print(render_prometheus(req_count, latency_ms))\n\n    print(\"--- influx line protocol ---\")\n    print(render_influx(req_count, latency_ms, ts_ns))\n\n    print(\"--- statsd packets ---\")\n    let sd = render_statsd(req_count, latency_ms)\n    let i = 0\n    while i < len(sd) {\n        print(\"  \" + sd[i])\n        i = i + 1\n    }\n\n    print(\"--- logfmt ---\")\n    print(render_logfmt(req_count, latency_ms))\n\n    print(\"--- OTLP/JSON (trace request) ---\")\n    let otlp = render_otlp(req_count, latency_ms, ts_ns)\n    let rs = otlp[\"resourceSpans\"]\n    print(\"resourceSpans count = \" + str(len(rs)))\n    let spans = rs[0][\"scopeSpans\"][0][\"spans\"]\n    print(\"first span name    = \" + spans[0][\"name\"])\n    print(\"first span status  = \" + str(spans[0][\"status\"][\"code\"]))\n}\n\nmain()\n",
